<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Privacy boundary. GitHub Pages cannot send HTTP headers, so the policy is
      delivered as a meta tag. connect-src 'none' blocks fetch, XHR, WebSocket,
      EventSource and sendBeacon from this page: the app has no reason to talk
      to any server. Changing this policy requires updating PROJECT_PRINCIPLES.md
      and scripts/check-build-output.mjs.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' blob:; font-src 'self'; worker-src 'self' blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'; manifest-src 'self'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Our Household Money</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app runs entirely in your browser and needs JavaScript turned on.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
