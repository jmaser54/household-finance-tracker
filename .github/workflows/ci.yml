name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04 # pinned: Playwright 1.56 does not support ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # full history for the repository hygiene check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:repo
      - run: npm run check:fixtures
      - run: npm run check:desktop
      - run: npm run build
      - run: npm run check:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # No screenshots, traces or reports are ever uploaded (PROJECT_PRINCIPLES.md §3.4).

  safari17-webkit:
    # The Safari APP on macOS Monterey can be 17.6; Playwright 1.44 bundles
    # WebKit 17.4. (Apps like ours get Monterey's older built-in WebKit: see
    # the webkit15 job.)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install Playwright 1.44.1 with WebKit 17.4 (separate from the project's Playwright)
        run: |
          mkdir -p "$RUNNER_TEMP/pw144"
          npm install --prefix "$RUNNER_TEMP/pw144" --no-save --ignore-scripts playwright@1.44.1
          "$RUNNER_TEMP/pw144/node_modules/.bin/playwright" install --with-deps webkit
      - name: Import every synthetic statement in WebKit 17.4
        run: |
          npx vite preview --host 127.0.0.1 --port 4180 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          PW_DIR="$RUNNER_TEMP/pw144" EXPECT_PLAYWRIGHT=1.44.1 node tests/compat/webkit-import.cjs

  webkit15:
    # The app's window uses macOS's built-in WebKit, not the Safari app's.
    # On the household's Monterey Mac that engine lacks DecompressionStream
    # (Safari 16.4), so it is older than 16.4. Playwright 1.22's official
    # image bundles WebKit 15.4, the closest automatable engine.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Import every synthetic statement in WebKit 15.4
        run: |
          npx vite preview --host 127.0.0.1 --port 4180 --strictPort &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4180/ >/dev/null && break; sleep 1; done
          docker run --rm --network host -v "$PWD:/w:ro" -w /w \
            -e PW_DIR=/tmp/pw -e EXPECT_PLAYWRIGHT=1.22.0 \
            mcr.microsoft.com/playwright:v1.22.0-focal \
            bash -c 'npm install --prefix /tmp/pw --no-save --ignore-scripts --silent playwright@1.22.0 && node tests/compat/webkit-import.cjs'

  macos-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rustc --version && cargo --version
      - name: Rust targets for a universal (Intel + Apple Silicon) app
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - run: npm run check:desktop
      - run: npm run test:rust
      - run: npm run build
      - run: npx playwright install webkit
      - name: UI network isolation in WebKit (the Mac app's engine)
        run: npm run test:e2e:webkit
      - name: Rosetta (to run the Intel half of the app in the smoke test)
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - name: Smoke build (CI only, never uploaded)
        run: npx tauri build --bundles app --target universal-apple-darwin --features smoke-test --ci
      - name: Smoke test, Intel and Apple Silicon (renders; statement import; encrypted storage; backup/restore; no outside access)
        run: scripts/macos-smoke-test.sh
      - name: Release build
        run: npx tauri build --bundles app --target universal-apple-darwin --ci
      - name: Verify release app (signature, entitlements, sockets, Gatekeeper)
        run: scripts/macos-verify-app.sh
      - name: Package
        run: |
          ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Household Money.app" Household-Money-macOS.zip
          shasum -a 256 Household-Money-macOS.zip | tee Household-Money-macOS.zip.sha256
      # The download contains only the app's code: no data, screenshots or logs.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Household-Money-macOS
          path: |
            Household-Money-macOS.zip
            Household-Money-macOS.zip.sha256
          retention-days: 7
          if-no-files-found: error
